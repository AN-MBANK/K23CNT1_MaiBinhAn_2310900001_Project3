<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Home - CRUD OneToMany</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-primary">Trang Chủ Ứng Dụng CRUD</h1>
    <p class="lead">Chào mừng đến với hệ thống quản lý danh mục và sản phẩm (One-to-Many).</p>

    <hr>

    <h3 class="mt-4">Chức năng chính:</h3>
    <div class="list-group">
        <a th:href="@{/category}" class="list-group-item list-group-item-action">
            <i class="fas fa-list"></i> 1. Quản lý Danh mục Sản phẩm (Category CRUD)
        </a>

        <a th:href="@{/products}" class="list-group-item list-group-item-action">
            <i class="fas fa-box"></i> 2. Quản lý Sản phẩm (Product CRUD - OneToMany)
        </a>
    </div>

    <hr class="mt-5">
    <small class="text-muted">Spring Boot 3 + Thymeleaf + JPA (LabGuide07)</small>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</html>
