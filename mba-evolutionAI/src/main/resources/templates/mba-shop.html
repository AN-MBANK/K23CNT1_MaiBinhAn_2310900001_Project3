<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa Hàng - MbaEvolutionAI</title>

    <link rel="stylesheet" th:href="@{/assets/index.css}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>
<body class="bg-gray-50 text-slate-800 antialiased font-sans">

<div th:replace="~{fragments/mba-header :: navbar}"></div>

<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Cửa Hàng</h1>

    <div class="flex flex-col lg:flex-row gap-8">

        <div class="w-full lg:w-64 space-y-8 h-fit lg:sticky lg:top-24">
            <form th:action="@{/shop}" method="GET" class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-2 mb-4 text-gray-900 font-bold">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-filter"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Bộ lọc
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tìm kiếm</label>
                    <input
                            type="text"
                            name="query"
                            placeholder="Tên sản phẩm, hãng..."
                            th:value="${searchQuery}"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-brand-500 focus:border-brand-500"
                    />
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Danh mục</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                    type="radio"
                                    name="category"
                                    value="All"
                                    th:checked="${selectedCategory == 'All'}"
                                    class="text-brand-600 focus:ring-brand-500"
                            />
                            <span class="text-sm text-gray-600 hover:text-gray-900">All</span>
                        </label>
                        <label th:each="cat : ${categories}" class="flex items-center gap-2 cursor-pointer">
                            <input
                                    type="radio"
                                    name="category"
                                    th:value="${cat}"
                                    th:checked="${selectedCategory == cat}"
                                    class="text-brand-600 focus:ring-brand-500"
                            />
                            <span class="text-sm text-gray-600 hover:text-gray-900" th:text="${cat}"></span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Giá tối đa:
                        <span th:text="${#numbers.formatDecimal(priceRange / 1000000, 0, 0)}"></span> tr
                    </label>
                    <input
                            type="range"
                            name="maxPrice"
                            min="0"
                            max="100000000"
                            step="1000000"
                            th:value="${priceRange}"
                            oninput="this.form.submit()"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-brand-600"
                    />
                    <div class="flex justify-between text-xs text-gray-400 mt-1">
                        <span>0đ</span>
                        <span>100tr+</span>
                    </div>
                </div>

                <button type="submit" class="w-full mt-6 bg-brand-600 text-white py-2 rounded-lg font-medium hover:bg-brand-700 transition">Áp dụng lọc</button>
            </form>
        </div>

        <div class="flex-1">
            <div class="flex justify-between items-center mb-6">
                <p class="text-gray-500">Hiển thị <span th:text="${products.size()}"></span> sản phẩm</p>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-500">Sắp xếp:</span>
                    <select class="border-gray-300 rounded-md text-sm focus:ring-brand-500 focus:border-brand-500">
                        <option>Mới nhất</option>
                        <option>Giá tăng dần (Chưa hỗ trợ)</option>
                    </select>
                </div>
            </div>

            <div th:if="${products.empty}" class="text-center py-20">
                <div class="inline-block p-4 bg-gray-100 rounded-full mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal text-gray-400"><line x1="21" x2="3" y1="12" y2="12"/><line x1="10" x2="3" y1="6" y2="6"/><line x1="21" x2="14" y1="6" y2="6"/><line x1="17" x2="3" y1="18" y2="18"/><line x1="21" x2="19" y1="18" y2="18"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-gray-900">Không tìm thấy sản phẩm</h3>
                <p class="text-gray-500">Vui lòng thử thay đổi bộ lọc tìm kiếm.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="product : ${products}">
                    <div th:replace="~{fragments/mba-product-card :: card(product=${product})}"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/mba-footer :: footer}"></div>

</body>
</html>
