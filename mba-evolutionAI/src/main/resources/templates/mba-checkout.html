<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - MbaEvolutionAI</title>

    <link rel="stylesheet" th:href="@{/assets/index.css}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>
<body class="bg-gray-50 text-slate-800 antialiased font-sans">

<div th:replace="~{fragments/mba-header :: navbar}"></div>

<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

        <div class="bg-brand-600 px-6 py-4 flex justify-between items-center text-white">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Xác nhận đơn hàng
            </h3>
        </div>

        <form th:action="@{/checkout/confirm}" method="POST" class="p-6">

            <div class="mb-6 bg-brand-50 p-4 rounded-xl border border-brand-100 text-center">
                <p class="text-gray-500 text-sm mb-1">Tổng thanh toán</p>
                <p class="text-3xl font-bold text-brand-700" th:text="${#numbers.formatCurrency(totalPrice)}"></p>
                <input type="hidden" name="totalPrice" th:value="${totalPrice}" />
            </div>

            <div th:if="${checkoutError}" class="mb-4 p-3 bg-red-100 border border-red-200 text-red-700 rounded-lg text-sm font-medium">
                Có lỗi xảy ra khi gửi đơn hàng. Vui lòng thử lại.
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Họ và tên người nhận</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <input
                                type="text"
                                name="name"
                                required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 transition"
                                placeholder="Nhập họ tên..."
                                th:value="${currentUser != null ? currentUser.fullName : ''}"
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Số điện thoại liên hệ</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-400"><path d="M22 16.92v3a2 2 0 0 1-2 2h-3.9a2 2 0 0 1-1.66-.9L10 16l4.28-4.28a2 2 0 0 1 1.42-.58c.45-.04.9.06 1.25.3l3.5 3.5a2 2 0 0 1 .3 1.25c-.04.35-.14.7-.3 1.05z"/></svg>
                        </div>
                        <input
                                type="tel"
                                name="phone"
                                required
                                pattern="[0-9]{10}"
                                title="Vui lòng nhập số điện thoại 10 số"
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 transition"
                                placeholder="0912..."
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Địa chỉ giao hàng</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-400"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        <textarea
                                name="address"
                                required
                                rows="2"
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 transition"
                                placeholder="Số nhà, đường, phường/xã..."
                        ></textarea>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <a th:href="@{/cart}" class="flex-1 py-3 px-4 border border-gray-300 rounded-xl text-gray-700 font-medium hover:bg-gray-50 transition flex justify-center items-center">
                    Quay lại
                </a>
                <button
                        type="submit"
                        class="flex-1 py-3 px-4 bg-brand-600 text-white rounded-xl font-bold hover:bg-brand-700 shadow-lg shadow-brand-500/30 transition flex justify-center items-center gap-2"
                >
                    Hoàn tất đặt hàng
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/mba-footer :: footer}"></div>

</body>
</html>
