<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đơn hàng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-slate-800">

<div th:replace="~{fragments/mba-header :: navbar}"></div>

<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Quản lý Đơn hàng</h1>
        <span class="bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full">
                Tổng: <span th:text="${orders.size()}">0</span> đơn
            </span>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 text-gray-500 uppercase font-medium border-b">
            <tr>
                <th class="px-6 py-4">Mã đơn</th>
                <th class="px-6 py-4">Khách hàng</th>
                <th class="px-6 py-4">Ngày đặt</th>
                <th class="px-6 py-4">Tổng tiền</th>
                <th class="px-6 py-4">Trạng thái</th>
                <th class="px-6 py-4 text-center">Hành động</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition">
                <td class="px-6 py-4 font-bold text-gray-900">
                    #<span th:text="${order.mbaOrderId}"></span>
                </td>
                <td class="px-6 py-4">
                    <div class="font-medium text-gray-900" th:text="${order.mbaFullName}"></div>
                    <div class="text-xs text-gray-500" th:text="${order.mbaPhone}"></div>
                </td>
                <td class="px-6 py-4 text-gray-500"
                    th:text="${#temporals.format(order.mbaOrderDate, 'dd/MM/yyyy HH:mm')}">
                </td>
                <td class="px-6 py-4 font-bold text-green-600"
                    th:text="${#numbers.formatCurrency(order.mbaTotalAmount)}">
                </td>
                <td class="px-6 py-4">
                    <span th:if="${order.mbaStatus == 'PENDING'}" class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-md text-xs font-bold">Chờ xử lý</span>
                    <span th:if="${order.mbaStatus == 'SHIPPING'}" class="px-2 py-1 bg-blue-100 text-blue-700 rounded-md text-xs font-bold">Đang giao</span>
                    <span th:if="${order.mbaStatus == 'COMPLETED'}" class="px-2 py-1 bg-green-100 text-green-700 rounded-md text-xs font-bold">Hoàn thành</span>
                    <span th:if="${order.mbaStatus == 'CANCELLED'}" class="px-2 py-1 bg-red-100 text-red-700 rounded-md text-xs font-bold">Đã hủy</span>
                </td>
                <td class="px-6 py-4 text-center flex justify-center gap-2">
                    <a th:if="${order.mbaStatus == 'PENDING'}"
                       th:href="@{/mba-admin/orders/update-status/{id}(id=${order.mbaOrderId}, status='SHIPPING')}"
                       class="text-blue-600 hover:underline">Giao hàng</a>

                    <a th:if="${order.mbaStatus == 'SHIPPING'}"
                       th:href="@{/mba-admin/orders/update-status/{id}(id=${order.mbaOrderId}, status='COMPLETED')}"
                       class="text-green-600 hover:underline">Hoàn tất</a>
                </td>
            </tr>

            <tr th:if="${orders.isEmpty()}">
                <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                    Chưa có đơn hàng nào.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="max-w-7xl mx-auto px-4 pt-6">
    <a th:href="@{/mba-admin}"
       class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 hover:text-blue-600 hover:border-blue-300 transition-all shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Quay lại Dashboard
    </a>
</div>
</body>
</html>
