<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ cá nhân - MbaEvolutionAI</title>

    <link rel="stylesheet" th:href="@{/assets/index.css}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>
<body class="bg-gray-50 text-slate-800 antialiased font-sans">

<div th:replace="~{fragments/mba-header :: navbar}"></div>

<div class="max-w-3xl mx-auto px-4 py-8 min-h-screen" th:object="${user}">

    <div class="flex items-center gap-4 mb-8">
        <a th:href="@{/}" class="p-2 hover:bg-gray-100 rounded-full transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Hồ Sơ Của Tôi</h1>
            <p class="text-gray-500 text-sm">Quản lý thông tin cá nhân và tài khoản</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 space-y-8">
        <div class="text-center">
            <div class="w-24 h-24 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>

            <h2 class="text-2xl font-bold text-gray-900" th:text="*{mbaUserFullName}"></h2>

            <p class="text-gray-500 text-sm" th:text="'@' + *{mbaUsername}"></p>
        </div>

        <div class="space-y-4 border-t pt-6">
            <h3 class="text-lg font-bold text-gray-900">Chi tiết tài khoản</h3>

            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <div>
                    <p class="text-xs text-gray-500">Email</p>
                    <p class="font-medium text-gray-800" th:text="*{mbaUserEmail}"></p>
                </div>
            </div>

            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600"><path d="M5 3v18"/><path d="M10 5l-2-2-2 2"/><path d="M16 3l-2-2-2 2"/><path d="M12 21h8"/><path d="M16 16h8"/><path d="M12 11h8"/></svg>
                <div>
                    <p class="text-xs text-gray-500">Tên đăng nhập</p>
                    <p class="font-medium text-gray-800" th:text="*{mbaUsername}"></p>
                </div>
            </div>

            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/><path d="M22 12s-4 7-10 7S2 12 2 12s4-7 10-7 10 7 10 7z"/></svg>
                <div>
                    <p class="text-xs text-gray-500">Vai trò</p>
                    <p class="font-medium text-gray-800" th:text="*{mbaRole == 'ADMIN' ? 'Quản Trị Viên' : 'Khách Hàng'}"></p>
                </div>
            </div>
        </div>

        <div class="border-t pt-6 flex justify-end">
            <a th:href="@{/user-orders}" class="px-6 py-2 bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700 transition">
                Xem Lịch Sử Đơn Hàng
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/mba-footer :: footer}"></div>

</body>
</html>
