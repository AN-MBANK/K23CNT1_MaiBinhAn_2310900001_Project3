<div th:fragment="modal"
     id="productModal"
     class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300"
     xmlns:th="http://www.thymeleaf.org">

    <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl transform transition-all scale-100 animate-fade-in-up">

        <form th:action="@{/mba-admin/products/save}"
              method="post"
              enctype="multipart/form-data"
              th:object="${productForm}">

            <input type="hidden" th:field="*{mbaProductId}" />
            <input type="hidden" th:field="*{mbaRating}" th:value="5" />
            <input type="hidden" th:field="*{mbaReviewsCount}" th:value="0" />

            <div class="flex justify-between items-center p-6 border-b border-gray-100">
                <h3 class="text-xl font-bold text-gray-900"
                    th:text="*{mbaProductId != null ? 'Chỉnh sửa sản phẩm' : 'Thêm sản phẩm mới'}">
                </h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 max-h-[70vh] overflow-y-auto custom-scrollbar">

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm</label>
                    <input type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                           th:field="*{mbaName}" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá bán (VNĐ)</label>
                    <input type="number" required min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                           th:field="*{mbaPrice}" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Giá gốc (VNĐ)</label>
                    <input type="number" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                           th:field="*{mbaOriginalPrice}" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label>
                    <select class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                            th:field="*{mbaCategory}">
                        <option value="Laptop">Laptop</option>
                        <option value="PC">PC Gaming</option>
                        <option value="Monitor">Màn hình</option>
                        <option value="Accessories">Phụ kiện</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Thương hiệu</label>
                    <input type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                           th:field="*{mbaBrand}" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tồn kho</label>
                    <input type="number" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                           th:field="*{mbaStock}" />
                </div>

                <div class="md:col-span-2 border border-dashed border-gray-300 p-4 rounded-xl bg-gray-50 text-center">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ảnh sản phẩm</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*"
                           th:required="*{mbaProductId == null}"
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                           onchange="previewImage(event)" />
                    <div id="image-preview" class="mt-4 flex justify-center min-h-[100px] items-center">
                        <img th:if="*{mbaImage != null}" th:src="*{mbaImage}" class="h-32 object-contain rounded-lg shadow-sm border bg-white p-2" />
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                    <textarea rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500"
                              th:field="*{mbaDescription}"></textarea>
                </div>

                <div class="md:col-span-2 border-t pt-4 mt-2">
                    <h4 class="font-bold text-gray-800 mb-3">Cấu hình chi tiết</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="CPU" class="border rounded px-3 py-2 text-sm" th:field="*{mbaCpu}" />
                        <input type="text" placeholder="RAM" class="border rounded px-3 py-2 text-sm" th:field="*{mbaRam}" />
                        <input type="text" placeholder="Ổ cứng" class="border rounded px-3 py-2 text-sm" th:field="*{mbaStorage}" />
                        <input type="text" placeholder="VGA/GPU" class="border rounded px-3 py-2 text-sm" th:field="*{mbaGpu}" />
                        <input type="text" placeholder="Màn hình" class="border rounded px-3 py-2 text-sm col-span-2" th:field="*{mbaScreen}" />
                    </div>
                </div>
            </div>

            <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
                <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg">Hủy</button>
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-lg">
                    <span th:text="*{mbaProductId != null ? 'Lưu thay đổi' : 'Thêm mới'}"></span>
                </button>
            </div>
        </form>
    </div>

    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var output = document.getElementById('image-preview');
                output.innerHTML = '<img src="' + reader.result + '" class="h-32 object-contain rounded-lg shadow-sm border bg-white p-2"/>';
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</div>
