<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
<nav th:fragment="navbar" class="bg-white sticky top-0 z-40 border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <a th:href="@{/}" class="flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8 text-brand-600 mr-2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h8v8H8z"/></svg>
                <span class="font-bold text-xl text-gray-900 tracking-tight">MbaEvolution<span class="text-brand-600">AI</span></span>
            </a>

            <div class="hidden md:flex items-center space-x-8">
                <a th:href="@{/}"
                   th:classappend="${currentUri == '/' ? 'text-brand-600 font-semibold' : 'text-gray-500 hover:text-gray-900'}">
                    Trang chủ
                </a>

                <a th:href="@{/shop}"
                   th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/shop') ? 'text-brand-600 font-semibold' : 'text-gray-500 hover:text-gray-900'}">
                    Sản phẩm
                </a>

                <a th:href="@{/about}"
                   th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/about') ? 'text-brand-600 font-semibold' : 'text-gray-500 hover:text-gray-900'}">
                    Giới thiệu
                </a>

                <th:block th:if="${session.currentUser != null and session.currentUser.mbaRole == 'ADMIN'}">
                    <a th:href="@{/mba-admin}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/mba-admin') ? 'text-red-600 font-semibold' : 'text-gray-500 hover:text-red-600'}"
                       class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/><rect width="7" height="9" x="14" y="3" rx="1"/><rect width="7" height="5" x="14" y="16" rx="1"/></svg> Admin
                    </a>
                </th:block>
            </div>

            <div class="flex items-center space-x-4">
                <a th:href="@{/cart}" class="text-gray-500 hover:text-brand-600 p-2 rounded-full hover:bg-gray-100 relative transition cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-brand-600 rounded-full">
                       !
                    </span>
                </a>

                <div class="hidden md:flex items-center space-x-2 border-l pl-4 ml-2">
                    <th:block th:if="${session.currentUser != null}">
                        <div th:replace="~{fragments/mba-user-menu :: menu(user=${session.currentUser})}"></div>
                    </th:block>

                    <th:block th:if="${session.currentUser == null}">
                        <a th:href="@{/login}" class="text-sm font-medium text-gray-700 hover:text-brand-600">Đăng nhập</a>
                        <span class="text-gray-300">|</span>
                        <a th:href="@{/register}" class="text-sm font-medium text-gray-700 hover:text-brand-600">Đăng ký</a>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
