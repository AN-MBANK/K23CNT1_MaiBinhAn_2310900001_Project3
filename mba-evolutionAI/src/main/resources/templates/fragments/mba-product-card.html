<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Card Fragment</title>
</head>
<body>
<div th:fragment="card(product)" class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden flex flex-col h-full border border-gray-100 group">

    <div class="relative cursor-pointer" th:onclick="'window.location.href=\'' + @{/detail/{id}(id=${product.mbaProductId})} + '\''">
        <img
                th:src="${product.mbaImage}"
                th:alt="${product.mbaName}"
                class="w-full h-48 object-cover object-center group-hover:scale-105 transition-transform duration-300"
                onerror="this.onerror=null; this.src='https://via.placeholder.com/400?text=No+Image';"
        />
        <th:block th:if="${product.mbaOriginalPrice != null and product.mbaOriginalPrice > product.mbaPrice}">
            <div class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">
                -<span th:text="${#numbers.formatDecimal((product.mbaOriginalPrice - product.mbaPrice) / product.mbaOriginalPrice * 100, 0, 0)}"></span>%
            </div>
        </th:block>

        <button
                class="absolute bottom-2 right-2 bg-white/90 p-2 rounded-full shadow-md text-gray-600 hover:text-brand-600 hover:bg-white transition-all opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0"
                title="So sánh sản phẩm này"
                onclick="event.stopPropagation(); alert('Logic So sánh AI sẽ được thêm bằng JavaScript');"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v9a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-9a7 7 0 0 0-7-7z"/></svg>
        </button>
    </div>

    <div class="p-4 flex-grow flex flex-col">
        <div class="text-xs text-brand-600 font-semibold uppercase tracking-wider mb-1" th:text="${product.mbaCategory}"></div>
        <h3
                class="text-lg font-semibold text-gray-900 mb-2 line-clamp-2 hover:text-brand-600 cursor-pointer"
                th:onclick="'window.location.href=\'' + @{/detail/{id}(id=${product.mbaProductId})} + '\''"
                th:text="${product.mbaName}"
        >
        </h3>

        <div class="flex items-center mb-2">
            <div class="flex text-yellow-400">
                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                    <svg th:if="${i <= product.mbaRating}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="text-yellow-400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <svg th:unless="${i <= product.mbaRating}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </th:block>
            </div>
            <span class="text-xs text-gray-500 ml-1" th:text="'(' + ${product.mbaReviewsCount} + ')'"></span>
        </div>

        <div class="text-xs text-gray-500 mb-4 space-y-1">
            <p th:if="${product.mbaCpu != null}">• CPU: <span th:text="${product.mbaCpu}"></span></p>
            <p th:if="${product.mbaGpu != null}">• GPU: <span th:text="${product.mbaGpu}"></span></p>
        </div>

        <div class="mt-auto flex items-center justify-between">
            <div>
               <span class="text-xl font-bold text-brand-600 block"
                     th:text="${product.mbaPrice != null ? #numbers.formatCurrency(product.mbaPrice) : 'Liên hệ'}"></span>

                <span th:if="${product.mbaOriginalPrice != null}" class="text-sm text-gray-400 line-through"
                      th:text="${#numbers.formatCurrency(product.mbaOriginalPrice)}"></span>
            </div>
            <button
                    onclick="alert('Logic Thêm vào giỏ hàng sẽ được thêm bằng AJAX');"
                    class="p-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-brand-600 hover:text-white transition-colors"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </button>
        </div>
    </div>
</div>
</body>
</html>
