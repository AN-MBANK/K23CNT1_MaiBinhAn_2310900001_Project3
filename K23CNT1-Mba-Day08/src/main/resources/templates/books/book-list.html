<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Book List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 bg-white">
    <h2>Book List</h2>

    <a  th:href="@{/books/new}" class="btn btn-success my-2">Add New Book</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Image</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Authors</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">0</td>
            <td th:text="${book.code}">Code</td>
            <td th:text="${book.name}">Name</td>
            <td>
                <img th:src="@{${book.imgUrl}}"
                     th:attr="alt=${book.name}" style="width: 50px; height: 50px;"/>
            </td>
            <td th:text="${book.quantity}">Quantity</td>
            <td th:text="${book.price}">Price</td>
            <td>
                <span th:each="ba: ${book.bookAuthors}"
                      class="mx-1 badge rounded-pill"
                      th:classappend="${ba.isEditor} ? 'bg-danger text-white' : 'bg-warning text-dark'">

                    <span th:text="${ba.author.name} +
                                   (${ba.isEditor} ? ' (Chủ biên)' : '')">Tác giả</span>
                </span>
            </td>
            <td class="actions">
                <a th:href="@{/books/edit/{id} (id=${book.id})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/books/delete/{id} (id=${book.id})}"
                   onclick="return confirm('Are you sure you want to delete this book?');"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
