<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Book Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 p-3 bg-white">
    <form action="#" th:action="@{/books/new}"
          th:object="${book}" method="post" enctype="multipart/form-data">

        <input type="hidden" th:if="${book.id != null}"
               th:value="${book.id}" name="id"/>

        <div class="card">
            <div class="card-header">
                <h1 th:text="${book.id != null ? 'Edit Book' : 'Create Book'}">Book Form</h1>
            </div>

            <div class="card-body">

                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div class="row mb-3">
                    <label for="code" class="col-sm-2 col-form-label">Code</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{code}" placeholder="Book Code"
                               class="form-control" id="code">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" placeholder="Book name"
                               class="form-control" id="name">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="imageBook" class="col-sm-2 col-form-label">Image Url</label>
                    <div class="col-sm-10">
                        <input type="file" name="imageBook" class="form-control" id="imageBook"/>
                        <input type="hidden" th:field="*{imgUrl}" placeholder="Book imgUrl" id="imgUrl"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="description" class="col-sm-2 col-form-label">Description</label>
                    <div class="col-sm-10">
                        <textarea th:field="*{description}" rows="2" class="form-control" id="description"></textarea>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="quantity" class="col-sm-2 col-form-label">Quantity</label>
                    <div class="col-sm-10">
                        <input type="number" th:field="*{quantity}" placeholder="Book quantity"
                               class="form-control" id="quantity"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="price" class="col-sm-2 col-form-label">Price</label>
                    <div class="col-sm-10">
                        <input type="number" th:field="*{price}" placeholder="Book price"
                               class="form-control" id="price"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Authors: </label>
                    <div class="col-sm-10 d-flex flex-column" id="author-selection">

                        <div th:each="author: ${authors}" class="mx-2 px-2 d-flex align-items-center">

                            <input type="checkbox"
                                   name="authorIds"
                                   th:id="'chkAuth'+${author.id}"
                                   th:value="${author.id}"
                                   class="author-checkbox"
                                   th:checked="${book.hasAuthor(author)}" />

                            <label th:text="${author.name}" th:attr="for='chkAuth'+${author.id}" class="me-3 ms-1"></label>

                            <input type="radio"
                                   name="editorId"
                                   th:id="'radioEditor'+${author.id}"
                                   th:value="${author.id}"
                                   class="editor-radio"

                                   th:disabled="!${book.hasAuthor(author)}"
                                   th:checked="${book.isEditor(author)}" />

                            <label th:attr="for='radioEditor'+${author.id}"> Chủ biên</label>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="isActive" class="col-sm-2 col-form-label">Active</label>
                    <div class="col-sm-10">
                        <input type="checkbox" th:field="*{isActive}" id="isActive" />
                    </div>
                </div>

            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-success"
                        th:text="${book.id != null ? 'Update' : 'Create'}">Save</button>
                <a th:href="@{/books}" class="btn btn-secondary">Back to list</a>
            </div>
        </div>
    </form>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const containers = document.querySelectorAll('#author-selection > div');

        containers.forEach(container => {
            const checkbox = container.querySelector('.author-checkbox');
            const radio = container.querySelector('.editor-radio');

            if (checkbox && radio) {
                // Khởi tạo trạng thái disabled dựa trên trạng thái checked hiện tại (tải từ DB)
                radio.disabled = !checkbox.checked;

                // Lắng nghe sự kiện thay đổi của checkbox
                checkbox.addEventListener('change', function() {
                    radio.disabled = !this.checked;
                    // Nếu checkbox bị bỏ chọn, radio button cũng phải bỏ chọn
                    if (!this.checked) {
                        radio.checked = false;
                    }
                });
            }
        });
    });
</script>

</body>
</html>
