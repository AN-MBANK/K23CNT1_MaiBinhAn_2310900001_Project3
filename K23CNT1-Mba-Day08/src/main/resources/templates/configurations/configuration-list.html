<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Configuration List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 bg-white">
    <h2>Configuration Types</h2>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

    <a th:href="@{/configurations/new}" class="btn btn-success my-2">Add New Configuration</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Active</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="config : ${configurations}">
            <td th:text="${config.id}">1</td>
            <td th:text="${config.name}">RAM</td>
            <td>
                <span th:if="${config.isActive}" class="badge bg-success">Yes</span>
                <span th:if="${!config.isActive}" class="badge bg-secondary">No</span>
            </td>
            <td>
                <a th:href="@{/configurations/edit/{id} (id=${config.id})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/configurations/delete/{id} (id=${config.id})}"
                   onclick="return confirm('Are you sure you want to delete this configuration type?');"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/products}" class="btn btn-info">Go to Product List</a>

</section>
</body>
</html>
