<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Configuration Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 p-3 bg-white">
    <form action="#" th:action="@{/configurations/new}" th:object="${configuration}" method="post">

        <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

        <div class="card">
            <div class="card-header">
                <h1 th:text="*{id != null ? 'Edit Configuration' : 'Create Configuration'}">Configuration Form</h1>
            </div>

            <div class="card-body">

                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                <div class="row mb-3">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" placeholder="e.g., CPU, RAM" class="form-control" id="name">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="isActive" class="col-sm-2 col-form-label">Active</label>
                    <div class="col-sm-10">
                        <input type="checkbox" th:field="*{isActive}" id="isActive" />
                    </div>
                </div>

            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-success"
                        th:text="*{id != null ? 'Update' : 'Create'}">Save</button>
                <a th:href="@{/configurations}" class="btn btn-secondary">Back to list</a>
            </div>
        </div>
    </form>
</section>
</body>
</html>
