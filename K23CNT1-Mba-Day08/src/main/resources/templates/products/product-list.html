<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Product List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 bg-white">
    <h2>Product List (Máy tính)</h2>

    <a href="#" th:href="@{/products/new}" class="btn btn-success my-2">Add New Product</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th> <th>Name</th>
            <th>Image</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Configurations</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.code}">Code B001</td> <td th:text="${product.name}">Laptop A</td>
            <td>
                <img th:src="@{${product.imgUrl}}"
                     th:attr="alt=${product.name}" style="width: 50px; height: 50px;"/>
            </td>
            <td th:text="${product.quantity}">10</td>

            <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">1,500,000.00</td>

            <td>
                <div th:each="pc: ${product.productConfigs}" class="mb-1">
                    <span class="badge bg-primary text-white" th:text="${pc.configuration.name}">RAM</span>:
                    <span th:text="${pc.value}" class="fw-bold">8GB</span>
                </div>
            </td>

            <td class="actions">
                <a th:href="@{/products/edit/{id} (id=${product.id})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/products/delete/{id} (id=${product.id})}"
                   onclick="return confirm('Are you sure you want to delete this product?');"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
