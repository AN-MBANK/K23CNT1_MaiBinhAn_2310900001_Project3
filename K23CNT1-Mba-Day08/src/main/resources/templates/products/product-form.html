<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <title>Product Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: #ccc">
<section class="container my-3 p-3 bg-white">
    <form action="#" th:action="@{/products/new}"
          th:object="${product}" method="post" enctype="multipart/form-data">

        <input type="hidden" th:if="${product.id != null}" th:value="${product.id}" name="id"/>

        <div class="card">
            <div class="card-header">
                <h1 th:text="${product.id != null ? 'Edit Product' : 'Create Product'}">Product Form</h1>
            </div>

            <div class="card-body">

                <div class="row mb-3">
                    <label for="name" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" placeholder="Product Name" class="form-control" id="name">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="imageFile" class="col-sm-2 col-form-label">Image</label>
                    <div class="col-sm-10">
                        <input type="file" name="imageFile" class="form-control" id="imageFile"/>
                        <input type="hidden" th:field="*{imgUrl}" id="imgUrl"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="quantity" class="col-sm-2 col-form-label">Quantity</label>
                    <div class="col-sm-4">
                        <input type="number" th:field="*{quantity}" placeholder="Quantity" class="form-control" id="quantity"/>
                    </div>
                    <label for="price" class="col-sm-2 col-form-label">Price</label>
                    <div class="col-sm-4">
                        <input type="number" th:field="*{price}" placeholder="Price" class="form-control" id="price"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="isActive" class="col-sm-2 col-form-label">Active</label>
                    <div class="col-sm-10">
                        <input type="checkbox" th:field="*{isActive}" id="isActive" />
                    </div>
                </div>


                <h3 class="mt-4">Configurations</h3>
                <hr/>

                <div th:each="config: ${configurations}" class="row mb-3 align-items-center">

                    <label th:for="${'configValue_' + config.id}" class="col-sm-2 col-form-label"
                           th:text="${config.name}"></label>

                    <div class="col-sm-10">
                        <input type="hidden" name="configIds" th:value="${config.id}" />

                        <input type="text"
                               name="configValues"
                               th:id="${'configValue_' + config.id}"
                               placeholder="Enter value (e.g., 8GB, Core i7)"
                               class="form-control"

                               th:value="${#lists.isEmpty(product.productConfigs.?[configuration.id == config.id]) ?
                   '' :
                   product.productConfigs.?[configuration.id == config.id][0].value}"
                        />
                    </div>
                </div>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-success"
                        th:text="${product.id != null ? 'Update' : 'Create'}">Save</button>
                <a th:href="@{/products}" class="btn btn-secondary">Back to list</a>
            </div>
        </div>
    </form>
</section>
</body>
</html>
