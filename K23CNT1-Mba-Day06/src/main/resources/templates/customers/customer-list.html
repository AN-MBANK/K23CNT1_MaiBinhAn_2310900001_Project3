<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Khách hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container bg-white py-4 mt-4">
    <h2 class="mb-4">DANH SÁCH KHÁCH HÀNG</h2>
    <hr/>
    <a href="/customers/add-new" class="btn btn-primary mb-3">Add New Customer</a>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Active</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.id}">1</td>
            <td th:text="${customer.username}">john_doe</td>
            <td th:text="${customer.fullName}">John Doe</td>
            <td th:text="${customer.email}">john@example.com</td>
            <td th:text="${customer.phone}">0987654321</td>
            <td>
                <span th:if="${customer.active}" class="badge bg-success">Active</span>
                <span th:unless="${customer.active}" class="badge bg-danger">Inactive</span>
            </td>
            <td>
                <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-info me-2">Edit</a>
                <a th:href="@{/customers/delete/{id}(id=${customer.id})}"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa không?')"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
