<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới Khách hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container bg-white py-4 mt-4">
    <div class="card">
        <div class="card-header">
            <h2>THÊM MỚI KHÁCH HÀNG</h2>
        </div>
        <form th:action="@{/customers}" th:object="${customer}" method="post">
            <div class="card-body">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3 row">
                    <label for="username" class="col-sm-2 col-form-label">Username</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="username" th:field="*{username}" required/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="password" class="col-sm-2 col-form-label">Password</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control" id="password" th:field="*{password}" required/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="fullName" class="col-sm-2 col-form-label">Full Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="email" class="col-sm-2 col-form-label">Email</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="email" th:field="*{email}" required/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="phone" class="col-sm-2 col-form-label">Phone</label>
                    <div class="col-sm-10">
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="address" class="col-sm-2 col-form-label">Address</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="address" th:field="*{address}"/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="birthDay" class="col-sm-2 col-form-label">Birth Day</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="birthDay" th:field="*{birthDay}" placeholder="yyyy-MM-dd"/>
                    </div>
                </div>

                <div class="mb-3 row">
                    <div class="col-sm-10 offset-sm-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>

            </div>
            <div class="card-footer">
                <button type="submit" class="btn btn-success">Save Customer</button>
                <a href="/customers" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
